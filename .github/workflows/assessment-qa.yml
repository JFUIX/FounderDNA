name: FounderDNA assessment browser QA
on:
  push:
    branches: [main]
    paths:
      - 'assessment.html'
      - 'assessment.js'
      - 'platform.css'
      - 'tests/**'
      - '.github/workflows/assessment-qa.yml'
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/founderdna-http.log 2>&1 &
      - name: Run assessment tests
        run: npx playwright test tests/assessment.spec.cjs --reporter=list
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: founder-assessment-test-results
          path: test-results/
          if-no-files-found: ignore
